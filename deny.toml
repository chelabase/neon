# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = "the marvin attack only affects private key decryption, not public key signature verification"

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "The paste crate is a build-only dependency with no runtime components. It is unlikely to have any security impact."

# Policy: this ignore list only shrinks. A new advisory is fixed by upgrading the
# dependency; an ignore needs the user's explicit approval and a reason. Every entry
# below has no fixed release reachable without replacing a dependency.

[[advisories.ignore]]
id = "RUSTSEC-2025-0141"
reason = "bincode 1.3.3 is unmaintained but is the final, complete 1.x release; 2.x/3.x change the wire format used for on-disk and inter-service data. No drop-in replacement. Used by pageserver, safekeeper, utils and others for internal serialization."

[[advisories.ignore]]
id = "RUSTSEC-2025-0134"
reason = "rustls-pemfile is unmaintained (no vulnerability), only parses PEM input. Used directly by the workspace (replacement is rustls-pki-types PemObject, many call sites) and transitively by gcp_auth and reqwest."

[[advisories.ignore]]
id = "RUSTSEC-2026-0258"
reason = "h2 0.3.x has no fix (patched only in 0.4.16+). h2 0.3 comes in through hyper 0.14, which routerify (internal management HTTP APIs) and the workspace crates built on it still require. Removing it means dropping routerify."

[[advisories.ignore]]
id = "RUSTSEC-2026-0174"
reason = "http-types 2.12.0 (unmaintained, header value ASCII check) is only used by azure_core in the neondatabase azure-sdk-for-rust fork, for Azure Blob remote storage; our code never builds Authorization or WWW-Authenticate headers from untrusted input."

[[advisories.ignore]]
id = "RUSTSEC-2026-0194"
reason = "quick-xml 0.26 (inferno 0.11 via pprof 0.14) is only used through quick_xml::Writer to emit flamegraph SVG, never to parse input. quick-xml 0.31 (azure_core, neondatabase fork) parses Azure Blob service responses from the operator-configured endpoint. No release of either dependent allows quick-xml >= 0.41."

[[advisories.ignore]]
id = "RUSTSEC-2026-0195"
reason = "Same quick-xml instances as RUSTSEC-2026-0194: 0.26 is writer-only (flamegraph SVG output), 0.31 parses Azure Blob service responses from the configured endpoint only."

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDDL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    # Zlib license has some restrictions if we decide to change sth
    { allow = ["Zlib"], name = "const_format_proc_macros", version = "*" },
    { allow = ["Zlib"], name = "const_format", version = "*" },
    # hashbrown 0.17's default hasher (via lru, via aws-sdk-s3)
    { allow = ["Zlib"], name = "foldhash", version = "*" },
    # Mozilla's CA bundle data (permissive data licence; compatible with our Apache-2.0 distribution)
    { allow = ["CDLA-Permissive-2.0"], name = "webpki-roots", version = "*" },
]

[licenses.private]
ignore = true
registries = []

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []

skip = []
skip-tree = []

[[bans.deny]]
# we use tokio, the same rationale applies for async-{io,waker,global-executor,executor,channel,lock}, smol
# if you find yourself here while adding a dependency, try "default-features = false", ask around on #rust
name = "async-std"

[[bans.deny]]
name = "async-io"

[[bans.deny]]
name = "async-waker"

[[bans.deny]]
name = "async-global-executor"

[[bans.deny]]
name = "async-executor"

[[bans.deny]]
name = "smol"

[[bans.features]]
# jsonwebtoken 11 picks its crypto backend by feature. With both `aws_lc_rs` and
# `rust_crypto` on, `CryptoProvider::get_default()` panics on every verify.
crate = "jsonwebtoken"
deny = ["rust_crypto"]

[[bans.deny]]
# We want to use rustls instead of the platform's native tls implementation.
name = "native-tls"

[[bans.deny]]
name = "openssl"

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Crate pinned to commit in origin repo due to opentelemetry version.
    # TODO: Remove this once crate is fetched from crates.io again.
    "https://github.com/mattiapenati/tower-otel",
]

[sources.allow-org]
github = [
    "neondatabase",
]
gitlab = []
bitbucket = []
